# Qwen3.5-4B, as ArgGYM's experiment 003 samples (rl/configs/qwen3.5-4b-003.yaml):
# training rollouts at its 40,960 cap, dev at the eval config's 65,536
# (rollout.response_length); both with the card's presence penalty 1.5, which
# verl's sampling config has no field for.
- name: train
  _target_: arggym_verl.agent_loop.SamplingAgentLoop
  sampling:
    max_tokens: 40960
    presence_penalty: 1.5
- name: dev
  _target_: arggym_verl.agent_loop.SamplingAgentLoop
  sampling:
    presence_penalty: 1.5
