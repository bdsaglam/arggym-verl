# ArgGYM on Qwen3.5-4B, three GPUs: the GSM8K control's algorithm (verl's LoRA
# recipe, LR 3e-5, KL, token IS) on the task of ArgGYM's experiment 003
# (rl/configs/qwen3.5-4b-003.yaml at a5b05fb, branch rl-003). Everything not set
# here is the GSM8K config's.
#
# From 003: the 57 training cells, the curriculum that draws from them, the 96-row
# dev split, the reward (a truncated completion pays 0 and stays in the loss), the
# model revision, thinking on, the 40,960-token training cap, card sampling with
# presence penalty 1.5 for training and dev, 2 dev samples per row at a
# 65,536-token cap, 100 steps. Not from 003: its algorithm (DAPO loss, LoRA r32,
# LR 2e-5, 8 x 8 a step) and its 20-step interval for dev and checkpoints (10 here).
#
# Memory, Qwen3.5 specifics and the step-time estimate: design.md, "ArgGYM run".

defaults:
  - gsm8k-hard-qwen3-0.6b
  - _self_

data:
  # `python -m arggym_verl.data $ARGGYM_ROOT/rl/configs/qwen3.5-4b-003.yaml
  #  --out data/arggym-qwen3.5-4b output_root=$PWD/data/arggym-pool` (README):
  # rl.pool's split, training restricted to 003's train_cells by rl.pool.restrict
  # (5,700 rows), dev every cell (96 rows).
  train_files: ${oc.env:ARGGYM_VERL_ROOT}/data/arggym-qwen3.5-4b/train.parquet
  val_files: ${oc.env:ARGGYM_VERL_ROOT}/data/arggym-qwen3.5-4b/dev.parquet
  # The eval lane's prompt reserve; the longest prompt is 2,328 tokens.
  max_prompt_length: 8192
  # The dev cap, the eval config's 65,536 (evals/conf/model/hf-qwen3.5-4b.yaml).
  # Training rollouts stop at 40,960 through their agent loop (agent_loops-arggym.yaml).
  max_response_length: 65536
  # 16 prompts x rollout.n 6 = 96 completions; mini-batch 8 x 6 = 48. verl pads a
  # batch to a multiple of lcm(ranks, mini-batch completions)
  # (trainer_base._get_required_batch_multiple): lcm(3, 48) = 48 divides 96, so
  # nothing is padded and each step takes two optimizer steps, as in the recipe.
  train_batch_size: 16
  # Each step's 16 prompts come from 003's curriculum (rl.curriculum, through
  # arggym_verl/curriculum.py): cells drawn in proportion to p(1 - p) + floor, p the
  # cell's pass rate, rows within a cell without replacement, seeded by data.seed.
  # The values are 003's `curriculum:` block.
  curriculum:
    # Initial pass rates: the base model's eval, 8 samples a cell, read through a
    # Beta(1, 1) prior. Relative to the ArgGYM checkout (rl.pool.ROOT).
    prior: results/hf-qwen3.5-4b__xml_tags__cot/metrics.json
    # An observation (one group) weighs half as much after this many later groups
    # of the same cell.
    half_life: 10
    # Added to every cell's p(1 - p), at most 0.25, so saturated and impossible
    # cells are still drawn now and then and their estimates can move.
    floor: 0.01
    # Every cell's pass rate and draw share to the metrics every this many steps.
    table_every: 5
  # The dataloader runs in the driver: worker processes would pull the next step's
  # prompts from the curriculum before this step's outcomes reach it.
  dataloader_num_workers: 0

actor_rollout_ref:
  model:
    # The snapshot 003 pins (Hub revision 851bf6e), BF16 as published. The
    # checkpoint is vision-language; verl loads it as Qwen3_5ForConditionalGeneration,
    # as its Qwen3.5 recipes do, and the vision tower gets no adapter (frozen with
    # the rest of the base). all-linear then adapts every Linear of the text model:
    # q/k/v/o in the 8 full-attention layers, in_proj_qkv/z/a/b and out_proj in the
    # 24 Gated DeltaNet layers, gate/up/down in all 32 (test_config.py pins the list
    # and that vLLM serves each).
    path: ${oc.env:HOME}/.cache/huggingface/hub/models--Qwen--Qwen3.5-4B/snapshots/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
    exclude_modules: .*visual.*
  actor:
    # The recipe's mini-batch of half the batch.
    ppo_mini_batch_size: 8
    # One micro-batch holds the longest training sequence, prompt reserve plus the
    # 40,960 cap; dynamic batching packs shorter ones up to it.
    ppo_max_token_len_per_gpu: 49152
    # As verl's Qwen3.5 recipes: entropy over the 248k vocabulary in chunks.
    entropy_from_logits_with_chunking: true
    checkpoint:
      # The adapter and its optimizer state only: a full checkpoint would carry the
      # FP32 base (18 GB) every 10 steps.
      save_lora_only: true
  rollout:
    # Six completions a prompt: the recipe's 5 is not divisible by 3, and 6 keeps
    # every mini-batch a multiple of the three ranks.
    n: 6
    # 003's max_model_len: the 65,536 dev cap plus the 8,192 prompt reserve.
    max_model_len: 73728
    log_prob_max_token_len_per_gpu: 49152
    # vLLM's share of each 80 GB GPU while it generates; the trainer keeps its
    # FP32 shards resident (design.md, "ArgGYM run").
    gpu_memory_utilization: 0.8
    # Sequences decoding at once per replica: a step's 96 completions are 32 per
    # replica; dev's 192 are 64, of which 48 run and the rest queue, so long dev
    # completions do not outgrow the KV cache and get preempted.
    max_num_seqs: 48
    # As verl's Qwen3.5 recipes (hybrid Gated DeltaNet cache).
    enable_prefix_caching: false
    # vLLM's periodic log lines: running and waiting requests, KV cache usage.
    disable_log_stats: false
    engine_kwargs:
      vllm:
        # As ArgGYM serves it: the vision tower is not loaded.
        language_model_only: true
    # 003's training sampling, the card's; presence penalty 1.5 comes from the agent loop.
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    # Dev: the eval config's sampling, 2 samples per row as 003.
    val_kwargs:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      n: 2
    agent:
      agent_loop_config_path: ${oc.env:ARGGYM_VERL_ROOT}/arggym_verl/config/agent_loops-arggym.yaml
  ref:
    log_prob_max_token_len_per_gpu: 49152

trainer:
  v1:
    colocate_async:
      # No batch generated ahead, so no completion is aborted and resumed. A
      # resumed completion is sent back as prompt plus tokens so far, and vLLM's
      # presence penalty counts output tokens only
      # (vllm/model_executor/layers/utils.py, apply_penalties): the penalty would
      # forget the first part of every resumed completion. Each step therefore
      # trains on its own batch, sampled by the weights it trains.
      num_warmup_batches: 0
  n_gpus_per_node: 3
  total_training_steps: 100
  test_freq: 10
  save_freq: 10
  experiment_name: arggym-qwen3.5-4b-lr3e-5-s0
